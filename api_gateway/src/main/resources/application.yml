server:
  port: 8080

app:
  api-prefix: api/public/v1

  services:
    authentication:
      uri: http://localhost:8081
      name: authentication_service
    accommodation:
      uri: http://localhost:8083
      name: accommodation_service
    search:
      uri: http://localhost:8085
      name: search_service
    booking:
      uri: http://localhost:8084
      name: booking_service
    file:
      uri: http://localhost:8088
      name: file_service
    profile:
      uri: http://localhost:8086
      name: profile_service
    rating:
      uri: http://localhost:8089
      name: rating_service
    promotion:
      uri: http://localhost:8087
      name: promotion_service
    notification:
      uri: http://localhost:8082
      name: notification_service
    chat:
      uri: http://localhost:8090
      name: chat_service
    location:
      uri: http://localhost:8091
      name: location_service
    payment:
      uri: http://localhost:8092
      name: payment_service
    inventory:
      uri: http://localhost:8093
      name: inventory_service

spring:
  application:
    name: api_gateway
  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "https://tripvibe-quantuanhuys-projects.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - X-Requested-With
              - Accept
            allowCredentials: true
            maxAge: 3600
      
      routes:
        - id: authentication_service
          uri: ${app.services.authentication.uri}
          predicates:
            - Path=/authentication_service/${app.api-prefix}/**
          filters:
            - name: Retry
              args:
                retries: 3
                
        - id: accommodation_service
          uri: ${app.services.accommodation.uri}
          predicates:
            - Path=/accommodation_service/${app.api-prefix}/**
          filters:
            - name: Retry
              args:
                retries: 3
                
        - id: search_service
          uri: ${app.services.search.uri}
          predicates:
            - Path=/search_service/${app.api-prefix}/**
          filters:
            - name: Retry
              args:
                retries: 3
                
        - id: booking_service
          uri: ${app.services.booking.uri}
          predicates:
            - Path=/booking_service/${app.api-prefix}/**
          filters:
            - name: Retry
              args:
                retries: 3
                
        - id: file_service
          uri: ${app.services.file.uri}
          predicates:
            - Path=/file_service/${app.api-prefix}/**
          filters:
            - name: Retry
              args:
                retries: 3
                
        - id: profile_service
          uri: ${app.services.profile.uri}
          predicates:
            - Path=/profile_service/${app.api-prefix}/**
          filters:
            - name: Retry
              args:
                retries: 3
                
        - id: rating_service
          uri: ${app.services.rating.uri}
          predicates:
            - Path=/rating_service/${app.api-prefix}/**
          filters:
            - name: Retry
              args:
                retries: 3
                
        - id: promotion_service
          uri: ${app.services.promotion.uri}
          predicates:
            - Path=/promotion_service/${app.api-prefix}/**
          filters:
            - name: Retry
              args:
